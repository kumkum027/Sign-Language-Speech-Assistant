# render.yaml - Render Blueprint Specification for AURALIS
# Enables 1-click full-stack deployment on Render (Web Service + Managed PostgreSQL)

version: "1"

services:
  # 1. Auralis Unified Web Application & Real-Time Socket Service
  - type: web
    name: auralis-web
    env: node
    plan: free
    region: oregon # or frankfurt, singapore, ohio
    buildCommand: npm install && npm run build:render
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: auralis-db
          property: connectionString

databases:
  # 2. Managed PostgreSQL Database
  - name: auralis-db
    plan: free
    region: oregon # matches web service region
    databaseName: auralis
    user: auralis
